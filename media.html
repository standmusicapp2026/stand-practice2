<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Stand player</title>
<!-- The little player that floats over the score: a YouTube or YouTube Music video, a Spotify or an
     Apple Music player, with Stand's own buttons under it (never over it). In the iPad app it is
     its own small web view, loaded with an https address so YouTube knows where it is shown; in a
     browser it sits in a frame of the page. -->
<style>
  :root { --bg: #15181f; --fg: #eef0f4; --mut: #8d96a8; --acc: #8fb0ff; --btn: transparent; --btn2: rgba(255,255,255,.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px -apple-system, system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  /* the picture, with a narrow margin and round corners, in the dark of the player */
  #stage { flex: 1; min-height: 0; position: relative; background: #000; margin: 0 6px; border-radius: 10px; overflow: hidden; }
  #stage iframe, #stage > div { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #bar { flex: none; height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--bg); cursor: grab; }
  /* (the dark round the picture and between the buttons moves the player: it is dragged from there) */
  body { cursor: grab; } #stage, #bar button { cursor: default; }
  #bar button { flex: none; height: 32px; min-width: 34px; padding: 0 8px; border: 0; border-radius: 9px; background: var(--btn); color: var(--fg); font: 600 12.5px -apple-system, system-ui, sans-serif; display: inline-flex; align-items: center; justify-content: center; transition: background .12s; }
  #bar button:active { background: var(--btn2); }
  #bar button.on { background: rgba(143,176,255,.18); color: var(--acc); }
  #bar button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #bar .t { flex: 1; min-width: 0; color: var(--mut); font-variant-numeric: tabular-nums; font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .x { background: transparent; color: var(--mut); }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 16px; color: var(--mut); font-size: 13px; line-height: 1.4; }
  #msg a { color: var(--acc); }
  #msg[hidden] { display: none; }
  body.audio #stage { background: var(--bg); margin: 0; border-radius: 0; }
  body.nobar #bar .yt { display: none; }
  /* the repeat button: tapped once (the start is marked) it waits for the end; on, it repeats */
  #bLoop { gap: 4px; }
  #bLoop .lt:empty { display: none; }
  #bLoop.arm { box-shadow: inset 0 0 0 2px var(--acc); color: var(--acc); }
  #bLoop.on .lt, #bLoop.arm .lt { font-variant-numeric: tabular-nums; font-size: 12px; }
  /* a small player: the buttons closer, the time left out; smaller still, no 5-second jumps */
  @media (max-width: 340px) { #bar { gap: 3px; padding: 0 4px; } #bar button { min-width: 30px; padding: 0 6px; } #bar .t { display: none; } #bar .x { margin-left: auto; } #bar .x ~ .x { margin-left: 0; } }
  @media (max-width: 270px) { #bBack, #bFwd { display: none !important; } }
  /* (the smallest: YouTube's own logo in the picture still opens it in YouTube) */
  @media (max-width: 232px) { body:not(.nobar) #bOpen { display: none; } }
  /* (small: the repeat button shows its state by its colour alone; waiting for the end, it pulses) */
  @media (max-width: 380px) { #bLoop .lt { display: none; } #bLoop.arm { animation: armp 1.2s ease-in-out infinite; } }
  @keyframes armp { 50% { box-shadow: inset 0 0 0 2px transparent; } }
  @media (prefers-reduced-motion: reduce) { #bLoop.arm { animation: none; } }
  /* In the iPad app, a video: the picture alone, round, with nothing round it; Stand's buttons in a
     bar of their own under it (above it, low on the screen), which comes when the video is touched
     and goes a few seconds later. Nothing is ever drawn over the picture. */
  html.clean, html.clean body { background: transparent; }
  body.clean { display: block; position: relative; cursor: default; }
  /* (where the app puts them: the picture, and the bar, which stays all on the screen) */
  body.clean #stage { position: absolute; left: 0; top: 0; right: 0; bottom: 52px; margin: 0; border-radius: 14px; }
  body.clean #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; border-radius: 14px; padding: 0 6px; cursor: default; transition: opacity .22s ease; }
  body.clean.barhide #bar { opacity: 0; pointer-events: none; }
  body.clean #bOpen { display: none; }
  @media (prefers-reduced-motion: reduce) { body.clean #bar { transition: none; } }
</style>
</head>
<body>
<div id="stage"><div id="msg">Loading…</div></div>
<div id="bar">
  <button id="bPlay" class="yt" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg></button>
  <button id="bBack" class="yt" aria-label="Back 5 seconds">−5</button>
  <button id="bFwd" class="yt" aria-label="On 5 seconds">+5</button>
  <button id="bSpeed" class="yt" aria-label="Speed">100%</button>
  <button id="bLoop" class="yt" aria-label="Repeat a passage: tap where it starts"><svg viewBox="0 0 24 24"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg><span class="lt"></span></button>
  <span class="t" id="time"></span>
  <button id="bOpen" class="x" aria-label="Open in its app"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  <button id="bClose" class="x" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const host = (op, extra) => {
  const m = { op, ...(extra || {}) };
  try { if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.standMediaUI) { window.webkit.messageHandlers.standMediaUI.postMessage(m); return; } } catch {}
  try { parent.postMessage({ standMedia: m }, '*'); } catch {}
};
const SPEEDS = [0.5, 0.6, 0.75, 0.85, 1, 1.1, 1.25];
// The speeds this video really has: YouTube plays only its own (often 0.25, 0.5, 0.75, 1, 1.25…) and
// moves any other toward 1 (asked for 85%, it would play at 100% while the button said 85%).
function ratesOf(yt) {
  let av = []; try { av = (yt.getAvailablePlaybackRates && yt.getAvailablePlaybackRates()) || []; } catch {}
  av = av.filter((r) => typeof r === 'number' && r >= 0.25 && r <= 1.5);
  if (!av.length) return [1];
  const ours = SPEEDS.filter((r) => av.includes(r));
  return ours.length >= 3 ? ours : av.slice().sort((a, b) => a - b);
}
const T = (x) => (P.tr && P.tr[x]) || x;
const P = { tr: null, kind: null, yt: null, sp: null, a: null, b: null, speed: 1, rates: null, url: '', tick: 0, playing: false };
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function say(t, html) { const m = $('#msg') || Object.assign(document.createElement('div'), { id: 'msg' }); if (!m.parentNode) $('#stage').append(m); if (html) m.innerHTML = t; else m.textContent = t; m.hidden = false; }
function clear() { clearInterval(P.tick); $('#stage').textContent = ''; P.yt = null; P.sp = null; P.a = P.b = null; P.rates = null; P.playing = false; syncBar(); }
function syncBar() {
  $('#bPlay').innerHTML = P.playing ? '<svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>';
  $('#bPlay').setAttribute('aria-label', T(P.playing ? 'Pause' : 'Play'));
  $('#bSpeed').textContent = Math.round(P.speed * 100) + '%';
  const lp = $('#bLoop'), on = P.a !== null && P.b !== null, arm = P.a !== null && P.b === null;
  lp.classList.toggle('on', on); lp.classList.toggle('arm', arm);
  lp.querySelector('.lt').textContent = on ? fmt(P.a) + '–' + fmt(P.b) : arm ? fmt(P.a) + '–…' : '';
  lp.setAttribute('aria-label', T(on ? 'Stop repeating' : arm ? 'Tap where the passage ends' : 'Repeat a passage: tap where it starts'));
  document.body.classList.toggle('nobar', P.kind !== 'youtube');
  document.body.classList.toggle('audio', P.kind === 'spotify' || P.kind === 'apple');
}
// ---- YouTube (and YouTube Music: the same videos) ----
function loadYouTubeApi() {
  return new Promise((res, rej) => {
    if (window.YT && window.YT.Player) return res(window.YT);
    window.onYouTubeIframeAPIReady = () => res(window.YT);
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; s.onerror = () => rej(new Error('net'));
    document.head.append(s);
    setTimeout(() => rej(new Error('timeout')), 15000);
  });
}
async function openYouTube(id, start) {
  const div = document.createElement('div'); div.id = 'yt'; $('#stage').append(div);
  say(T('Loading the video…'));
  let YT; try { YT = await loadYouTubeApi(); } catch { say(T('YouTube could not be reached. Check the internet connection, then try again.')); host('error', { code: 'net' }); return; }
  P.yt = new YT.Player('yt', {
    videoId: id, width: '100%', height: '100%',
    playerVars: { playsinline: 1, rel: 0, modestbranding: 1, start: Math.floor(start || 0), origin: location.origin, enablejsapi: 1 },
    events: {
      onReady: () => { const m = $('#msg'); if (m) m.hidden = true; P.rates = ratesOf(P.yt); try { P.yt.setPlaybackRate(P.speed); } catch {} host('ready'); },
      // (YouTube says which speed it really plays: that is what the button shows)
      onPlaybackRateChange: (e) => { if (typeof e.data === 'number' && e.data > 0) { P.speed = e.data; syncBar(); } },
      onStateChange: (e) => { P.playing = e.data === 1; syncBar(); host('state', { playing: P.playing }); },
      onError: (e) => { const why = T({ 2: 'This link is not a video YouTube knows.', 5: 'This video cannot play here.', 100: 'This video is no longer on YouTube, or it is private.', 101: 'Whoever put this video on YouTube does not let it play outside YouTube.', 150: 'Whoever put this video on YouTube does not let it play outside YouTube.', 153: 'YouTube did not accept where this player is shown.' }[e.data] || 'This video cannot play here.');
        say(why + ' <a href="#" id="goOut"></a>', true); const go0 = $('#goOut'); if (go0) go0.textContent = T('Open it in YouTube'); const g = $('#goOut'); if (g) g.onclick = (ev) => { ev.preventDefault(); host('openOut', { url: P.url }); }; host('error', { code: e.data }); },
    },
  });
  P.tick = setInterval(() => {
    if (!P.yt || !P.yt.getCurrentTime) return;
    const t = P.yt.getCurrentTime(), d = P.yt.getDuration ? P.yt.getDuration() : 0;
    if (P.a !== null && P.b !== null && t >= P.b) P.yt.seekTo(P.a, true);
    $('#time').textContent = P.a !== null && P.b === null ? T('Tap again where it ends') : fmt(t) + (d ? ' / ' + fmt(d) : '');
  }, 250);
}
// ---- Spotify: its own player (a part of a track without a Spotify login in this player) ----
function openSpotify(type, id) {
  const f = document.createElement('iframe');
  f.src = `https://open.spotify.com/embed/${type}/${id}?utm_source=generator&theme=0`;
  f.allow = 'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture';
  f.setAttribute('loading', 'eager');
  $('#stage').append(f);
}
// ---- Apple Music: its own player ----
function openApple(path) {
  const f = document.createElement('iframe');
  f.src = 'https://embed.music.apple.com' + path;
  f.allow = 'autoplay *; encrypted-media *; fullscreen *; clipboard-write';
  f.setAttribute('sandbox', 'allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation allow-top-navigation-by-user-activation');
  $('#stage').append(f);
}
window.mediaOpen = (o) => {
  document.documentElement.classList.toggle('clean', !!o.clean); document.body.classList.toggle('clean', !!o.clean);
  if (o.clean) { window.mediaLayout(o); showBar(); }
  if (o.tr) { P.tr = o.tr; for (const b of document.querySelectorAll('#bar button[aria-label]')) b.setAttribute('aria-label', T(b.dataset.en || (b.dataset.en = b.getAttribute('aria-label')))); }
  clear(); P.kind = o.kind; P.url = o.url || ''; P.speed = 1; syncBar();
  if (o.kind === 'youtube') openYouTube(o.id, o.start);
  else if (o.kind === 'spotify') openSpotify(o.type, o.id);
  else if (o.kind === 'apple') openApple(o.path);
  else say(T('This link cannot play here.'));
};
// A video in the iPad app: its buttons come when it is touched, and go again 3.5 s after the last
// touch (not while a passage to repeat waits for its end); the app is told, so a touch where they
// were goes through to the score.
let barT = 0, barWas = null;
function showBar() {
  if (!document.body.classList.contains('clean')) return;
  document.body.classList.remove('barhide'); barSaid(true);
  clearTimeout(barT); barT = setTimeout(hideBar, 3500);
}
function hideBar() {
  if (P.a !== null && P.b === null) { barT = setTimeout(hideBar, 3500); return; }
  document.body.classList.add('barhide'); barSaid(false);
}
function barSaid(on) { if (barWas === on) return; barWas = on; host('bar', { shown: on }); requestAnimationFrame(() => { try { sendKeep(); } catch {} }); }
window.mediaTouched = showBar;
const placeAt = (e, r) => { if (!Array.isArray(r) || r.length !== 4) return; Object.assign(e.style, { left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px', right: 'auto', bottom: 'auto' }); };
window.mediaLayout = (o) => { if (!o) return; placeAt($('#stage'), o.pic); placeAt($('#bar'), o.bar); requestAnimationFrame(() => { try { sendKeep(); } catch {} }); };
document.getElementById('bar').addEventListener('pointerdown', () => { if (document.body.classList.contains('clean')) showBar(); }, true);
// Stand asks: pause (when the player is put away at the side), play, the speed
window.mediaCmd = (c) => {
  if (P.kind !== 'youtube' || !P.yt || !P.yt.pauseVideo) return;
  if (c.cmd === 'pause') P.yt.pauseVideo(); else if (c.cmd === 'play') P.yt.playVideo();
  else if (c.cmd === 'speed') { P.speed = c.value; P.yt.setPlaybackRate(c.value); syncBar(); }
};
$('#bPlay').onclick = () => { if (!P.yt || !P.yt.getPlayerState) return; if (P.yt.getPlayerState() === 1) P.yt.pauseVideo(); else P.yt.playVideo(); };
$('#bBack').onclick = () => { if (P.yt && P.yt.seekTo) P.yt.seekTo(Math.max(0, P.yt.getCurrentTime() - 5), true); };
$('#bFwd').onclick = () => { if (P.yt && P.yt.seekTo) P.yt.seekTo(P.yt.getCurrentTime() + 5, true); };
$('#bSpeed').onclick = () => {
  if (!P.yt || !P.yt.setPlaybackRate) return;
  const R = P.rates && P.rates.length ? P.rates : SPEEDS;
  // (the next speed after the one playing now)
  const next = R.find((r) => r > P.speed + 0.001) ?? R[0];
  P.speed = next; try { P.yt.setPlaybackRate(next); } catch {} syncBar();
};
// Repeat a passage, with one button: a tap where it starts, a tap where it ends (it goes back to the
// start and repeats), a tap to stop repeating.
$('#bLoop').onclick = () => {
  if (!P.yt || !P.yt.getCurrentTime) return;
  const t = P.yt.getCurrentTime();
  if (P.a !== null && P.b !== null) { P.a = P.b = null; }
  else if (P.a === null) P.a = t;
  else if (t > P.a + 0.3) { P.b = t; P.yt.seekTo(P.a, true); }
  else P.a = t;   // (the end before the start: the start is marked again here)
  syncBar();
};
$('#bClose').onclick = () => { clear(); host('close'); };
$('#bOpen').onclick = () => { if (P.kind === 'youtube' && P.yt && P.yt.pauseVideo) P.yt.pauseVideo(); host('openOut', { url: P.url }); };
// Stand out of sight (another app, the screen locked): a video pauses, as YouTube asks (no playing
// in the background)
document.addEventListener('visibilitychange', () => { if (document.hidden && P.kind === 'youtube' && P.yt && P.yt.pauseVideo) try { P.yt.pauseVideo(); } catch {} });
window.addEventListener('pagehide', () => { if (P.kind === 'youtube' && P.yt && P.yt.pauseVideo) try { P.yt.pauseVideo(); } catch {} });
// In the iPad app: where a touch must stay the page's own (the picture and the buttons); anywhere
// else on the dark of the player, a drag moves the player (the app moves it, as from its top bar).
const keep = () => {
  const r = [], add = (b) => { if (b.width && b.height) r.push([b.left, b.top, b.width, b.height].map((v) => Math.round(v))); };
  const clean = document.body.classList.contains('clean');
  // (a video: dragged by its picture, but for YouTube's own buttons along its bottom and a link in
  // a message; a frame: the whole player is the player's own)
  if (clean) { const s0 = $('#stage').getBoundingClientRect(); add({ left: s0.left, top: s0.bottom - 50, width: s0.width, height: 50 }); for (const a of document.querySelectorAll('#msg a')) add(a.getBoundingClientRect()); }
  else add($('#stage').getBoundingClientRect());
  if (!clean || !document.body.classList.contains('barhide')) for (const e of document.querySelectorAll('#bar button')) add(e.getBoundingClientRect());
  return r;
};
let keepWas = '';
const sendKeep = () => { const k = keep(), s2 = JSON.stringify(k); if (s2 === keepWas) return; keepWas = s2; try { window.webkit.messageHandlers.standMediaUI.postMessage({ op: 'keep', rects: k }); } catch {} };
if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.standMediaUI) {
  try { const ro = new ResizeObserver(() => requestAnimationFrame(sendKeep)); ro.observe(document.body); ro.observe($('#bar')); for (const b of document.querySelectorAll('#bar button')) ro.observe(b); } catch {}
  addEventListener('resize', () => requestAnimationFrame(sendKeep));
  setInterval(sendKeep, 1000);
}
// (in a browser: what to play comes in the address)
try { const h = decodeURIComponent(location.hash.slice(1)); if (h) window.mediaOpen(JSON.parse(h)); } catch {}
host('loaded');
</script>
</body>
</html>
