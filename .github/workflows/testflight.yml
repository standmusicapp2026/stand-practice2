name: Send to TestFlight

# Builds Stand signed for the App Store and uploads it to TestFlight.
# Run it by hand (Actions -> Send to TestFlight -> Run workflow).
# The only secret is ASC_KEY_P8 (the App Store Connect API key file);
# the IDs below are not secret.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASC_KEY_ID: 4QUF9J958K
  ASC_ISSUER_ID: 3fc99af8-9475-4622-932a-cf90ff0a4172
  APPLE_TEAM_ID: 2T3G759RBL

jobs:
  testflight:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the web app
        run: |
          mkdir -p ios/Stand/www
          cp -R index.html manifest.webmanifest css js vendor icons ios/Stand/www/
          if [ -d covers ]; then cp -R covers ios/Stand/www/; fi
          if [ -d examples ]; then cp -R examples ios/Stand/www/; fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "The ASC_KEY_P8 secret is missing"; exit 1; fi
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (signed by Apple's cloud signing)
        shell: bash
        run: |
          set -o pipefail
          cd ios
          xcodebuild -project Stand.xcodeproj -scheme Stand -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Stand.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 1000 )) \
            archive | tail -n 60

      - name: Upload to TestFlight
        shell: bash
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Stand.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 60

      - name: Clean up the key
        if: always()
        run: rm -rf "$HOME/private_keys"
