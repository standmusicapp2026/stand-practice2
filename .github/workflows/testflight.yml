name: Send to TestFlight

# Builds Stand signed for the App Store and uploads it to TestFlight.
# It runs when the testflight branch is pushed (or by hand once it is on the default branch).
# The only secret is ASC_KEY_P8 (the App Store Connect API key file);
# the IDs below are not secret.

on:
  workflow_dispatch:
  push:
    branches: [testflight]

permissions:
  contents: read

env:
  ASC_KEY_ID: 4QUF9J958K
  ASC_ISSUER_ID: 3fc99af8-9475-4622-932a-cf90ff0a4172
  APPLE_TEAM_ID: 2T3G759RBL

jobs:
  testflight:
    # (the Intel Macs when the Apple-silicon ones are all busy: the newest Xcode 26 on it is chosen)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Choose Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "No Xcode 26 on this Mac"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"; xcodebuild -version

      - name: Bundle the web app
        run: |
          mkdir -p ios/Stand/www
          cp -R index.html manifest.webmanifest css js vendor icons ios/Stand/www/
          if [ -d covers ]; then cp -R covers ios/Stand/www/; fi
          if [ -d examples ]; then cp -R examples ios/Stand/www/; fi

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "The ASC_KEY_P8 secret is missing"; exit 1; fi
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (unsigned; Apple signs it for the App Store on export)
        shell: bash
        run: |
          cd ios
          xcodebuild -project Stand.xcodeproj -scheme Stand -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Stand.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION=$(( ${{ github.run_number }} + 1000 )) \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 || { grep -E "error|warning: .*sign" "$RUNNER_TEMP/archive.log" | head -40; tail -n 40 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/archive.log"

      - name: Upload to TestFlight
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Stand.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { grep -iE "error" "$RUNNER_TEMP/export.log" | head -40; tail -n 40 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -n 20 "$RUNNER_TEMP/export.log"

      - name: Clean up the key
        if: always()
        run: rm -rf "$HOME/private_keys"
