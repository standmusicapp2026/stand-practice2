name: Stand
options:
  bundleIdPrefix: com.paulo
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
targets:
  Stand:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Stand
        excludes:
          - "www/**"
      - path: Stand/www
        type: folder
        buildPhase: resources
    info:
      path: Stand/Info.plist
      properties:
        CFBundleDisplayName: Stand AI
        CFBundleName: Stand
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        # (a metronome, drone, scale or recording that is playing keeps playing when you leave Stand)
        UIBackgroundModes: [audio]
        # (the languages Stand speaks: the web view then reports the device's language to the app)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, pt-PT, pt-BR, es, fr, de, it, nl, pl, ru, ja, zh-Hans, ko]
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Stand listens to your instrument for the tuner, harmonics, the drone that follows your key, turning pages as you play, and your recordings. Sound is analysed on this device and is not uploaded."
        NSAppleMusicUsageDescription: "Stand plays the Apple Music recording you choose under Listen, with your subscription, so you can hear it while you read the score."
        NSCameraUsageDescription: "Stand uses the camera to film your practice, to scan sheet music, to let your iPhone film for your iPad, and (only if you turn it on) to see when you wink to turn the page. Wink detection happens on this device; no picture of your face is saved or sent."
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF score
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Image
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]
          - CFBundleTypeName: Stand backup
            LSHandlerRank: Owner
            LSItemContentTypes: [com.paulo.stand.backup]
          # (MusicXML from Sibelius, Dorico, MuseScore, Finale: "Open in Stand" puts it in Compose)
          - CFBundleTypeName: MusicXML score
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.w3c.music-notation.musicxml, org.w3c.music-notation.musicxml.uncompressed, org.musicxml.musicxml, org.musicxml.compressed, com.recordare.musicxml, com.recordare.musicxml.compressed, com.recordare.musicxml.uncompressed, com.makemusic.musicxml, public.xml]
          # (forScore's own files: a score shared from forScore, a setlist, an archive)
          - CFBundleTypeName: forScore score
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.forScore.4sc, com.forScore.4ss, com.forScore.4sb]
          - CFBundleTypeName: MIDI file
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.midi-audio]
        UTImportedTypeDeclarations:
          - UTTypeConformsTo: [public.data, public.content, public.zip-archive]
            UTTypeDescription: MusicXML (compressed)
            UTTypeIdentifier: org.w3c.music-notation.musicxml
            UTTypeTagSpecification:
              public.filename-extension: [mxl]
              public.mime-type: [application/vnd.recordare.musicxml]
          - UTTypeConformsTo: [public.xml, public.data, public.content]
            UTTypeDescription: MusicXML
            UTTypeIdentifier: org.w3c.music-notation.musicxml.uncompressed
            UTTypeTagSpecification:
              public.filename-extension: [musicxml]
              public.mime-type: [application/vnd.recordare.musicxml+xml]
          - UTTypeConformsTo: [public.data, public.content]
            UTTypeDescription: forScore score
            UTTypeIdentifier: com.forScore.4sc
            UTTypeTagSpecification:
              public.filename-extension: [4sc]
          - UTTypeConformsTo: [public.data, public.content]
            UTTypeDescription: forScore setlist
            UTTypeIdentifier: com.forScore.4ss
            UTTypeTagSpecification:
              public.filename-extension: [4ss]
          - UTTypeConformsTo: [public.data, public.archive]
            UTTypeDescription: forScore backup
            UTTypeIdentifier: com.forScore.4sb
            UTTypeTagSpecification:
              public.filename-extension: [4sb]
        UTExportedTypeDeclarations:
          - UTTypeConformsTo: [public.data]
            UTTypeDescription: Stand backup
            UTTypeIdentifier: com.paulo.stand.backup
            UTTypeTagSpecification:
              public.filename-extension: [standbackup]
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSLocalNetworkUsageDescription: "Stand connects your iPad and iPhone once you have linked them with a code, so the iPhone can film for the iPad and show your practice and scores."
        NSPhotoLibraryAddUsageDescription: "Stand saves the videos and pictures you choose to export to your photo library."
        NSBonjourServices:
          - _stand-link._tcp
          - _stand-link._udp
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulo.stand.ai
        PRODUCT_NAME: Stand
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "2.12"
        CURRENT_PROJECT_VERSION: "31"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: NO
